<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rovanele Climatização | Ar-condicionado, VRF e Chillers</title>
<meta name="description" content="Instalação e manutenção de ar-condicionado, sistemas VRF e chillers. Solicite seu orçamento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --marinho:#0A1F44;
  --marinho-2:#102c5e;
  --gelo:#F2F8FF;
  --gelo-2:#D8EAFB;
  --azul:#6FB6F2;
  --texto:#1b2a41;
  --estrela:#F5B400;
  --zap:#25D366;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',Arial,sans-serif;color:var(--texto);background:#fff;line-height:1.6}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',Arial,sans-serif;line-height:1.1}
a{color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ---------- FAIXA NO TOPO (passando em loop) ---------- */
.faixa{position:sticky;top:0;z-index:50;height:44px;overflow:hidden;display:flex;align-items:center;
  background:#fff;color:var(--marinho);border-bottom:3px solid var(--marinho)}
.faixa-trilho{display:flex;width:max-content;animation:passar 28s linear infinite}
.faixa:hover .faixa-trilho{animation-play-state:paused}
.faixa-grupo{display:flex;flex-shrink:0}
.faixa-item{white-space:nowrap;padding:0 28px;font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.faixa-item::after{content:"❄";margin-left:56px;color:var(--azul)}
@keyframes passar{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ---------- PRIMEIRA DOBRA ---------- */
.hero{position:relative;min-height:calc(100vh - 44px);display:flex;flex-direction:column;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,var(--marinho) 0%,var(--marinho-2) 60%,#1c4a8a 100%)}
/* Foto de fundo (arquivo hero.jpg) com movimento lento: vai e volta, parecendo vídeo */
.hero-foto{position:absolute;inset:0;background:url('hero.jpg') 75% center/cover no-repeat;
  animation:respirar 16s ease-in-out infinite alternate;transform-origin:75% 50%}
@keyframes respirar{
  from{transform:scale(1)}
  to{transform:scale(1.10)}
}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(10,31,68,.88) 0%,rgba(10,31,68,.55) 42%,rgba(10,31,68,0) 75%)}
.topo,.hero-conteudo{position:relative;z-index:2}
/* Tudo da primeira dobra alinhado na mesma linha, à esquerda */
.hero .wrap{max-width:none;margin:0;padding-left:clamp(22px,5vw,72px);padding-right:22px}
.topo{padding:26px 0}
.marca{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.marca span{font-weight:600;opacity:.8;margin-left:.4em}
.hero-conteudo{flex:1;display:flex;align-items:center;padding:30px 0 80px;text-align:left}
.hero h1{font-size:clamp(2.4rem,6.2vw,4.5rem);font-weight:800;max-width:14ch;margin-bottom:22px;text-shadow:0 2px 18px rgba(10,31,68,.35)}
.hero p{font-size:clamp(1.05rem,2vw,1.25rem);max-width:48ch;color:var(--gelo-2);margin-bottom:34px}

/* Botão verde do WhatsApp */
.btn{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:1.05rem;
  letter-spacing:.04em;text-transform:uppercase;
  padding:18px 34px;border-radius:999px;background:var(--zap);color:#fff;
  border:2px solid var(--zap);box-shadow:0 10px 26px rgba(37,211,102,.35);
  transition:transform .25s,background .25s,color .25s,border-color .25s,box-shadow .25s}
.btn svg{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.btn:hover,.btn:focus-visible{background:#fff;color:var(--marinho);border-color:#fff;
  transform:translateY(-4px);box-shadow:0 16px 34px rgba(255,255,255,.28)}
.btn:hover svg,.btn:focus-visible svg{fill:var(--zap)}
.hero-nota{display:block;margin-top:16px;font-size:.92rem;color:var(--gelo-2);opacity:.9}
